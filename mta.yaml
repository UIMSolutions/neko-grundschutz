_schema-version: "3.3"
ID: grundschutz
version: 1.0.0
description: BSI IT-Grundschutz project management (vibe.d backend, SAP Fiori 3 frontend, approuter)

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - bash backend/build/build.sh release

modules:
  # ------------------------------------------------------------------ D / vibe.d backend
  - name: grundschutz-srv
    type: custom
    path: backend
    build-parameters:
      builder: custom
      commands: []
      build-result: dist
      ignore: ["data/", ".dub/", "build/bin/"]
    parameters:
      buildpack: binary_buildpack
      command: ./grundschutz serve
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      GS_STORAGE: json
      GS_DATA_FILE: data/grundschutz.json
      GS_LOG_LEVEL: info
      GS_BACKUP_INTERVAL: "60"
    requires:
      - name: grundschutz-xsuaa
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ------------------------------------------------------------------ Fiori 3 / UI5 frontend (static content)
  - name: grundschutz-ui
    type: html5
    path: frontend
    build-parameters:
      builder: custom
      commands: []
      supported-platforms: []
      ignore: ["node_modules/", "test/", "localService/"]

  # ------------------------------------------------------------------ approuter (single entry point)
  - name: grundschutz-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      ignore: ["default-env.json", "node_modules/"]
      requires:
        - name: grundschutz-ui
          artifacts: ["./*"]
          target-path: resources/
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: grundschutz-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: grundschutz-backend
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: grundschutz-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: approuter/xs-security.json
